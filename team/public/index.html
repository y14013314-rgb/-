<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SUKHA 团队登录</title><link rel="stylesheet" href="/team/team.css"><script src="/team/team.js" defer></script><main><a href="/">SUKHA Travel · 官网</a><h1>团队后台</h1><p>使用已授权邮箱接收验证码。</p><form id="send"><label for="email">登录邮箱</label><input id="email" type="email" autocomplete="email" required maxlength="254"><button>发送验证码</button></form><form id="verify" hidden><label for="code">邮件中的 8 位验证码</label><input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{8}" maxlength="8" required><button>登录</button><button type="button" id="back">重新获取验证码</button></form><p id="message" role="status" aria-live="polite"></p><section id="workspace" hidden><h2>登录成功</h2><p id="identity"></p><p>当前可编辑：Baiyun 白云号。其他产品正在接入，尚不能在此修改。</p><p id="publication"></p><form id="editor"><div id="fields"></div><div class="editor-actions"><button type="submit">保存草稿</button><a id="preview" href="/api/team/preview" target="_blank" rel="noopener">预览已保存草稿 ↗</a><button type="button" id="publish">发布到官网</button></div></form><p>主图和视频封面可从电脑上传 JPG、PNG 或 WebP 图片，也可填写已有素材路径或 HTTPS 图片地址。上传图片会公开访问，请勿上传个人证件等私密资料。发布会同时更新产品详情页与列车列表卡片。</p><section id="members" hidden><h2>同事账号</h2><p>同事可以编辑和预览草稿，只有管理员可以发布。添加邮箱不会发送邀请邮件，请自行将后台链接告知同事。</p><form id="member-form"><label>同事邮箱<input id="member-email" type="email" autocomplete="off" required maxlength="254"></label><button>授权编辑</button></form><div id="member-list"></div></section><button id="logout">退出登录</button></section></main></html>
