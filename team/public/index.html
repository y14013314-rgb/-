<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SUKHA 团队登录</title><link rel="stylesheet" href="/team/team.css"><script src="/team/team.js" defer></script><main><a href="/">SUKHA Travel · 官网</a><h1>团队后台</h1><p>使用已授权邮箱接收验证码。</p><form id="send"><label for="email">登录邮箱</label><input id="email" type="email" autocomplete="email" required maxlength="254"><button>发送验证码</button></form><form id="verify" hidden><label for="code">邮件中的 8 位验证码</label><input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{8}" maxlength="8" required><button>登录</button><button type="button" id="back">重新获取验证码</button></form><p id="message" role="status" aria-live="polite"></p><section id="workspace" hidden><h2>登录成功</h2><p id="identity"></p><p>邮箱登录测试已通过。内容编辑与发布功能正在接入，目前不能修改官网内容。</p><button id="logout">退出登录</button></section></main></html>
