<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SUKHA 内容工作台</title><link rel="stylesheet" href="/team/team.css"><script src="/team/team.js" defer></script><main><a href="/">SUKHA Travel · 官网</a><header class="workspace-heading"><div><p class="eyebrow">SUKHA TRAVEL</p><h1>内容工作台</h1></div></header><p>使用已授权邮箱接收验证码。</p><form id="send"><label for="email">登录邮箱</label><input id="email" type="email" autocomplete="email" required maxlength="254"><button>发送验证码</button></form><form id="verify" hidden><label for="code">邮件中的 8 位验证码</label><input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{8}" maxlength="8" required><button>登录</button><button type="button" id="back">重新获取验证码</button></form><p id="message" role="status" aria-live="polite"></p><section id="workspace" hidden><h2 id="session-title">登录成功</h2><p id="identity"></p><p>当前支持 4 款列车、4 款游轮。选择产品后编辑、保存和预览，所有已授权同事都可自行发布。</p><div id="product-cards" class="product-cards" aria-label="选择产品"></div><label class="product-picker">当前产品<select id="product-select"></select></label><p id="publication"></p><form id="editor"><nav id="editor-tabs" class="editor-tabs" aria-label="内容分区"></nav><div id="fields"></div><div class="editor-actions"><button type="submit">保存草稿</button><a id="preview" href="/api/team/preview" target="_blank" rel="noopener">预览已保存草稿 ↗</a><button type="button" id="publish">发布到官网</button></div></form><p>在“图片与视频”中查看和更换图片。保存草稿不会修改官网，点击“发布到官网”后才会生效。视频文件上传暂未启用。</p><section id="members" hidden><h2>同事账号</h2><p>同事可以编辑、预览并自行发布。成员授权仍由管理员管理。添加邮箱不会发送邀请邮件，请自行将后台链接告知同事。</p><form id="member-form"><label>同事邮箱<input id="member-email" type="email" autocomplete="off" required maxlength="254"></label><button>授权编辑</button></form><div id="member-list"></div></section><button id="logout">退出登录</button></section></main></html>
