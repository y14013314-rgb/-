<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SUKHA 团队工作台</title><link rel="stylesheet" href="/admin/admin.css"><script src="/admin/admin.js" defer></script></head><body><header><strong>SUKHA <small>团队工作台</small></strong><nav><a href="/">官网</a><a href="/signout-with-chatgpt?return_to=%2Fadmin%2F" target="_top">退出</a></nav></header><main><div id="access"><h1>正在验证权限…</h1></div><div id="workspace" hidden><div class="toolbar"><div><p class="kicker">客户与旅行计划</p><h1>询价与报价</h1><p id="identity"></p></div><button id="reload">刷新询价</button></div><p class="notice">询价会保存到后台。邮件通知尚未开通，接收地址：<span id="notification-address"></span>。请定期查看本工作台。</p><p id="message" role="status"></p><div class="layout"><aside><label>搜索客户或编号<input id="search" placeholder="姓名、邮箱、询价编号"></label><div id="list"></div></aside><section id="detail"><div class="empty">从左侧选择一条询价，查看需求、记录跟进或制作报价。</div></section></div><section id="team" hidden><h2>团队权限</h2><p>每位同事使用自己的 ChatGPT 账号登录。添加邮箱只授权后台访问，不会发送邀请邮件。</p><div id="team-list"></div><form id="team-form"><label>同事登录邮箱<input name="email" type="email" required></label><label>角色<select name="role"><option value="staff">跟进人员</option><option value="admin">管理员</option></select></label><button>授权访问</button></form></section></div></main><dialog id="link-dialog"><h2>报价已发布</h2><p>复制下方专属链接，通过你与客户已有的联系渠道发送。拥有此链接的人可以查看和接受该报价，请勿公开分享。</p><input id="quote-link" readonly><p>邮件未自动发送。链接只在本次弹窗显示，请保存后关闭；如遗失，可作废报价并重新创建。</p><button id="copy-link">复制链接</button><button id="close-link">已保存，关闭</button><p id="copy-status"></p></dialog></body></html>
